name: Kent Radar Citizen App
description: Mobile application for citizens to report municipal issues

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  
  # Networking & API
  http: ^1.1.0
  socket_io_client: ^2.0.0
  
  # Location & Maps
  google_maps_flutter: ^2.5.0
  geolocator: ^10.0.0
  
  # Camera & Image
  image_picker: ^1.0.0
  camera: ^0.10.0
  
  # Storage
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  
  # Authentication
  firebase_core: ^2.24.0
  firebase_auth: ^4.10.0
  firebase_messaging: ^14.6.0
  google_sign_in: ^6.1.0
  
  # UI
  flutter_screenutil: ^5.9.0
  get: ^4.6.0
  intl: ^0.19.0
  
  # Date & Time
  table_calendar: ^3.0.0
  
  # Image Caching
  cached_network_image: ^3.3.0
  
  # File Management
  path_provider: ^2.1.0
  
  # JSON Serialization
  json_serializable: ^6.7.0
  
  # Validation
  form_builder_validators: ^9.1.0
  
  # OTP Input
  pinput: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  json_serializable: ^6.7.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600